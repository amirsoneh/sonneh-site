
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#00512f">

  <title>Contact — SONNEH</title>

  <meta name="description"
    content="Contact SONNEH Design Studio in Perth for design projects, creative collaborations and enquiries.">

  <link rel="stylesheet" href="style.css">
  <link rel="icon" href="favicon.ico">

  <style>
    .contact-layout {
      width: 100%;
      max-width: 620px;
      flex: 1;
      margin: 0 auto;
      padding: 25px 24px;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .contact-layout h1 {
      font-size: clamp(36px, 5vw, 50px);
      font-weight: 800;
      letter-spacing: -.035em;
      margin: 0 0 10px;
    }

    .contact-intro {
      font-size: 15px;
      line-height: 1.6;
      color: var(--muted);
      margin: 0 0 22px;
    }

    .contact-form {
      display: grid;
      gap: 12px;
    }

    .form-field label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 6px;
    }

    .contact-form input,
    .contact-form textarea {
      display: block;
      width: 100%;
      padding: 12px 14px;
      border: 1px solid rgba(255,255,255,.3);
      border-radius: 5px;
      background: rgba(255,255,255,.07);
      color: white;
      font: inherit;
      font-size: 14px;
    }

    .contact-form input::placeholder,
    .contact-form textarea::placeholder {
      color: rgba(255,255,255,.55);
    }

    .contact-form textarea {
      min-height: 90px;
      resize: vertical;
    }

    .contact-form input:focus,
    .contact-form textarea:focus {
      outline: 2px solid white;
      outline-offset: 2px;
    }

    .contact-form button {
      width: 100%;
      padding: 13px 20px;
      border: none;
      border-radius: 5px;
      background: white;
      color: #00512f;
      font: inherit;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      transition: opacity .2s ease;
    }

    .contact-form button:hover {
      opacity: .88;
    }

    .contact-form button:disabled {
      opacity: .6;
      cursor: wait;
    }

    .form-status {
      margin: 0;
      font-size: 13px;
      line-height: 1.5;
      color: white;
    }

    .form-status:empty {
      display: none;
    }

    .contact-details {
      margin-top: 20px;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.7;
    }

    .contact-details p {
      margin: 0 0 7px;
    }

    .contact-details a {
      color: white;
      text-underline-offset: 4px;
    }

    @media (max-width: 640px) {
      .contact-layout {
        padding: 25px 20px;
      }

      .contact-layout h1 {
        font-size: 38px;
      }

      .contact-intro {
        margin-bottom: 20px;
      }
    }
  </style>
</head>

<body>

  <header class="topbar">
    <nav class="nav">
      <a class="brand" href="index.html">SONNEH</a>

      <ul class="menu">
        <li>
          <a href="index.html">Home</a>
        </li>
        <li>
          <a href="about.html">About</a>
        </li>
        <li>
          <a href="contact.html" class="active">
            Contact
          </a>
        </li>
      </ul>
    </nav>
  </header>

  <main class="contact-layout">

    <h1>Let's connect.</h1>

    <p class="contact-intro">
      For project enquiries, creative collaborations
      or general conversations, we'd love to hear
      from you.
    </p>

    <form
      id="contact-form"
      class="contact-form"
      action="https://formspree.io/f/meagzyjb"
      method="POST"
    >

      <div class="form-field">
        <label for="name">Your name</label>
        <input
          id="name"
          name="name"
          type="text"
          placeholder="Full name"
          autocomplete="name"
          required>
      </div>

      <div class="form-field">
        <label for="email">Email address</label>
        <input
          id="email"
          name="email"
          type="email"
          placeholder="you@example.com"
          autocomplete="email"
          required>
      </div>

      <div class="form-field">
        <label for="message">Your message</label>
        <textarea
          id="message"
          name="message"
          placeholder="Tell us a little about your enquiry..."
          required></textarea>
      </div>

      <input
        type="hidden"
        name="_subject"
        value="New SONNEH Website Enquiry">

      <button id="send-button" type="submit">
        Send enquiry
      </button>

      <p
        id="form-status"
        class="form-status"
        role="status"
        aria-live="polite"></p>

    </form>

    <div class="contact-details">

      <p>
        Prefer email?
        <a href="mailto:info@sonneh.com">
          info@sonneh.com
        </a>
      </p>

      <p>
        Instagram:
        <a
          href="https://www.instagram.com/sonneh_design/"
          target="_blank"
          rel="noopener noreferrer">
          @sonneh_design
        </a>
      </p>

      <p>Perth, Western Australia</p>

    </div>

  </main>

  <footer class="footer">
    <p>© SONNEH 2026</p>
  </footer>

  <script>
    const form = document.getElementById("contact-form");
    const statusMessage = document.getElementById("form-status");
    const sendButton = document.getElementById("send-button");

    form.addEventListener("submit", async function(event) {
      event.preventDefault();

      sendButton.disabled = true;
      sendButton.textContent = "Sending...";
      statusMessage.textContent = "";

      try {
        const response = await fetch(form.action, {
          method: "POST",
          body: new FormData(form),
          headers: {
            "Accept": "application/json"
          }
        });

        if (response.ok) {
          statusMessage.textContent =
            "Thank you. Your message has been sent successfully.";

          form.reset();
        } else {
          statusMessage.textContent =
            "Your message could not be sent. Please try again.";
        }

      } catch (error) {
        statusMessage.textContent =
          "Connection error. Please try again or email info@sonneh.com.";
      } finally {
        sendButton.disabled = false;
        sendButton.textContent = "Send enquiry";
      }
    });
  </script>

</body>
</html>
