
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#00512f">

  <title>Contact — SONNEH</title>
  <meta name="description" content="Contact SONNEH Design Studio in Perth for design projects, creative collaborations and enquiries.">

  <link rel="stylesheet" href="style.css">
  <link rel="icon" href="favicon.ico" sizes="any">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">

</head>

<body>

  <header class="topbar">
    <nav class="nav" aria-label="Main navigation">
      <a class="brand" href="index.html">SONNEH</a>

      <ul class="menu">
        <li><a href="index.html">Home</a></li>
        <li><a href="about.html">About</a></li>
        <li><a href="contact.html" class="active" aria-current="page">Contact</a></li>
      </ul>
    </nav>
  </header>

  <main class="contact-layout">

    <h1>Let's connect.</h1>

    <p class="contact-intro">
      For project enquiries, creative collaborations or general
      conversations, we'd love to hear from you.
    </p>

    <form
      id="contact-form"
      class="contact-form"
      action="https://formspree.io/f/meagzyjb"
      method="POST"
    >

      <div class="form-field">
        <label for="name">Your name</label>
        <input
          id="name"
          name="name"
          type="text"
          placeholder="Full name"
          autocomplete="name"
          required
        >
      </div>

      <div class="form-field">
        <label for="email">Email address</label>
        <input
          id="email"
          name="email"
          type="email"
          placeholder="you@example.com"
          autocomplete="email"
          required
        >
      </div>

      <div class="form-field">
        <label for="message">Your message</label>
        <textarea
          id="message"
          name="message"
          rows="3"
          placeholder="Tell us a little about your enquiry..."
          required
        ></textarea>
      </div>

      <input
        type="hidden"
        name="_subject"
        value="New SONNEH Website Enquiry"
      >

      <button id="send-button" type="submit">
        Send enquiry
      </button>

      <p
        id="form-status"
        class="form-status"
        role="status"
        aria-live="polite"
      ></p>

    </form>

    <div class="contact-details">
      <p>
        Prefer email?
        <a href="mailto:info@sonneh.com">info@sonneh.com</a>
      </p>

      <p>
        Instagram:
        <a
          href="https://www.instagram.com/sonneh_design/"
          target="_blank"
          rel="noopener noreferrer"
        >@sonneh_design</a>
      </p>

      <p>Perth, Western Australia</p>
    </div>

  </main>

  <footer class="footer">
    <p>© SONNEH 2026</p>
  </footer>

  <script>
    const form = document.getElementById("contact-form");
    const statusMessage = document.getElementById("form-status");
    const sendButton = document.getElementById("send-button");

    form.addEventListener("submit", async function(event) {
      event.preventDefault();

      sendButton.disabled = true;
      sendButton.textContent = "Sending...";
      statusMessage.textContent = "";

      try {
        const response = await fetch(form.action, {
          method: "POST",
          body: new FormData(form),
          headers: {
            "Accept": "application/json"
          }
        });

        if (response.ok) {
          statusMessage.textContent =
            "Thank you. Your message has been sent successfully.";
          form.reset();
        } else {
          statusMessage.textContent =
            "Your message could not be sent. Please try again.";
        }
      } catch (error) {
        statusMessage.textContent =
          "Connection error. Please try again or email info@sonneh.com.";
      } finally {
        sendButton.disabled = false;
        sendButton.textContent = "Send enquiry";
      }
    });
  </script>

</body>
</html>
