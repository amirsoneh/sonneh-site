
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#00512F">
  <meta name="description" content="SONNEH — Concept Design & Design Strategy. An independent design studio based in Perth, Western Australia.">
  <title>SONNEH | Concept Design & Design Strategy</title>

  <style>
    :root {
      --green: #00512F;
      --white: #FFFFFF;
      --soft: #D9E8DE;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      min-height: 100%;
    }

    body {
      background: var(--green);
      color: var(--white);
      font-family: Arial, Helvetica, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    .site {
      position: relative;
      isolation: isolate;
      display: flex;
      flex-direction: column;
      min-height: 100svh;
      overflow: hidden;
      background: var(--green);
    }

    .header, .hero, .footer {
      position: relative;
      z-index: 2;
      width: min(90%, 1500px);
      margin-left: auto;
      margin-right: auto;
    }

    .header {
      padding-top: 34px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 24px;
    }

    .logo {
      font-size: clamp(28px, 3vw, 43px);
      font-weight: 800;
      letter-spacing: -1.8px;
      line-height: 1;
    }

    .navigation {
      display: flex;
      align-items: center;
      gap: clamp(22px, 3vw, 52px);
    }

    .navigation a {
      font-size: 17px;
      font-weight: 600;
      opacity: .85;
      padding-bottom: 7px;
    }

    .navigation a:hover,
    .navigation a:focus-visible {
      opacity: 1;
    }

    .navigation .active {
      opacity: 1;
      border-bottom: 2px solid white;
    }

    .hero {
      margin-top: auto;
      margin-bottom: auto;
      padding: 110px 0 90px;
    }

    .eyebrow {
      margin: 0 0 36px;
      font-size: clamp(12px, 1.25vw, 17px);
      font-weight: 500;
      letter-spacing: .21em;
    }

    h1 {
      position: relative;
      z-index: 3;
      margin: 0;
      font-size: clamp(34px, 4.5vw, 76px);
      font-weight: 800;
      letter-spacing: -.045em;
      line-height: 1.12;
      white-space: nowrap;
    }

    .description {
      max-width: 620px;
      margin: 32px 0 0;
      font-size: clamp(17px, 1.5vw, 23px);
      line-height: 1.6;
      color: var(--soft);
    }

    .location {
      margin-top: 55px;
    }

    .location-line {
      width: 54px;
      height: 1px;
      background: white;
      margin-bottom: 24px;
    }

    .location p {
      margin: 0;
      font-size: 13px;
      letter-spacing: .24em;
    }

    .footer {
      padding: 20px 0 27px;
      display: flex;
      justify-content: flex-end;
      font-size: 13px;
      color: var(--soft);
    }

    /* Animated artwork: right side only */
    .artwork {
      position: absolute;
      z-index: 0;
      right: 0;
      top: 10%;
      width: 51%;
      height: 82%;
      overflow: hidden;
      pointer-events: none;
    }

    .artwork svg {
      display: block;
      width: 100%;
      height: 100%;
    }

    .topo-line {
      fill: none;
      stroke: white;
      stroke-width: 1.15;
      vector-effect: non-scaling-stroke;
      opacity: .23;
    }

    .fragment {
      fill: none;
      stroke: white;
      stroke-width: 2.5;
      stroke-linecap: round;
    }

    /* Soft boundary between artwork and text */
    .artwork::before {
      content: "";
      position: absolute;
      inset: 0;
      z-index: 1;
      pointer-events: none;
      background: linear-gradient(
        90deg,
        var(--green) 0%,
        rgba(0,81,47,.6) 8%,
        transparent 30%
      );
    }

    @media (max-width: 1100px) {
      h1 {
        white-space: normal;
        max-width: 850px;
      }

      .artwork {
        width: 55%;
        opacity: .8;
      }
    }

    @media (max-width: 650px) {
      .header {
        width: calc(100% - 40px);
        padding-top: 24px;
        flex-wrap: wrap;
        gap: 24px;
      }

      .logo { font-size: 32px; }

      .navigation { gap: 25px; }

      .navigation a { font-size: 14px; }

      .hero {
        width: calc(100% - 40px);
        padding: 95px 0 65px;
      }

      .eyebrow {
        font-size: 11px;
        line-height: 1.8;
        letter-spacing: .14em;
        margin-bottom: 28px;
      }

      h1 {
        font-size: clamp(38px, 9vw, 56px);
        line-height: 1.12;
      }

      .description {
        font-size: 17px;
        max-width: 420px;
      }

      .location { margin-top: 45px; }

      .location p { font-size: 11px; }

      .footer {
        width: calc(100% - 40px);
        font-size: 12px;
      }

      .artwork {
        top: 43%;
        right: -20%;
        width: 90%;
        height: 48%;
        opacity: .3;
      }

      .artwork::before {
        background: linear-gradient(
          180deg,
          var(--green),
          transparent 45%
        );
      }
    }
  </style>
</head>

<body>
  <div class="site">

    <div class="artwork" aria-hidden="true">
      <svg id="sonneh-art"
           viewBox="0 0 700 700"
           preserveAspectRatio="xMidYMid meet">
        <g id="topo"></g>
        <g id="pieces"></g>
      </svg>
    </div>

    <header class="header">
      <a class="logo" href="index.html" aria-label="SONNEH Home">
        SONNEH
      </a>

      <nav class="navigation" aria-label="Main navigation">
        <a class="active" href="index.html" aria-current="page">Home</a>
        <a href="about.html">About</a>
        <a href="contact.html">Contact</a>
      </nav>
    </header>

    <main class="hero">
      <p class="eyebrow">
        CONCEPT DESIGN &amp; DESIGN STRATEGY
      </p>

      <h1>From Complexity to Clarity.</h1>

      <p class="description">
        Design thinking that transforms complexity into
        meaningful spaces and considered solutions.
      </p>

      <div class="location">
        <div class="location-line"></div>
        <p>PERTH, WESTERN AUSTRALIA</p>
      </div>
    </main>

    <footer class="footer">
      &copy; SONNEH 2026
    </footer>

  </div>

  <script>
    (() => {
      "use strict";

      const NS = "http://www.w3.org/2000/svg";
      const topo = document.getElementById("topo");
      const pieces = document.getElementById("pieces");
      const reducedMotion = window.matchMedia(
        "(prefers-reduced-motion: reduce)"
      ).matches;

      let seed = 20261122;

      function random() {
        seed = (seed * 16807) % 2147483647;
        return (seed - 1) / 2147483646;
      }

      function createSVG(tag, attributes, parent) {
        const el = document.createElementNS(NS, tag);
        for (const [key, value] of Object.entries(attributes)) {
          el.setAttribute(key, value);
        }
        parent.appendChild(el);
        return el;
      }

      const lines = [];

      // Organic, irregular topographic lines.
      for (let i = 0; i < 17; i++) {
        const y = 240 + i * 19;
        const variation = Math.sin(i * .55) * 17;

        const d = [
          `M -50 ${y + 35}`,
          `C 120 ${y - 110 + variation},`,
          `205 ${y + 105},`,
          `340 ${y - 35}`,
          `S 530 ${y - 100 + variation},`,
          `760 ${y - 85}`
        ].join(" ");

        const path = createSVG("path", {
          d,
          class: "topo-line"
        }, topo);

        lines.push(path);
      }

      const fragments = [];

      // Scattered white marks inspired by the business card.
      for (let i = 0; i < 46; i++) {
        const x = 70 + random() * 550;
        const y = 90 + random() * 480;
        const length = 7 + random() * 17;
        const angle = random() * Math.PI * 2;

        const targetX = 80 + (i % 12) * 48;
        const targetY = 390 + Math.floor(i / 12) * 19;

        const path = createSVG("path", {
          d: `M ${-length / 2} 0 L ${length / 2} 0`,
          class: "fragment",
          transform: `translate(${x} ${y}) rotate(${angle * 180 / Math.PI})`
        }, pieces);

        fragments.push({
          el: path,
          x, y, angle,
          targetX, targetY
        });
      }

      function smooth(t) {
        return t * t * (3 - 2 * t);
      }

      function interpolate(a, b, t) {
        return a + (b - a) * t;
      }

      // 12-second narrative cycle:
      // 0-3s scattered complexity
      // 3-8s transformation
      // 8-11s clarity
      // 11-12s soft reset

      function render(time) {
        const cycle = (time % 12000) / 12000;

        let clarity;

        if (cycle < .25) {
          clarity = 0;
        } else if (cycle < .67) {
          clarity = smooth((cycle - .25) / .42);
        } else if (cycle < .92) {
          clarity = 1;
        } else {
          clarity = 1 - smooth((cycle - .92) / .08);
        }

        lines.forEach((line, i) => {
          const opacity = interpolate(.04, .32, clarity);
          line.style.opacity = opacity;
          line.setAttribute(
            "transform",
            `translate(0 ${Math.sin(i * .5 + clarity * 2) * (1 - clarity) * 12})`
          );
        });

        fragments.forEach((item, i) => {
          const x = interpolate(item.x, item.targetX, clarity);
          const y = interpolate(item.y, item.targetY, clarity);
          const rotation = interpolate(
            item.angle * 180 / Math.PI,
            0,
            clarity
          );

          item.el.setAttribute(
            "transform",
            `translate(${x} ${y}) rotate(${rotation})`
          );

          item.el.style.opacity = interpolate(
            .75,
            .015,
            clarity
          );
        });
      }

      if (reducedMotion) {
        render(9600);
      } else {
        let start = null;

        function animate(timestamp) {
          if (start === null) start = timestamp;
          render(timestamp - start);
          requestAnimationFrame(animate);
        }

        requestAnimationFrame(animate);
      }
    })();
  </script>
</body>
</html>
