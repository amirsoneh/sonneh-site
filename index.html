
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#00512F">
  <meta name="description" content="SONNEH — Independent interior design and design strategy studio in Perth, Western Australia.">
  <title>SONNEH | Concept Design & Design Strategy</title>

  <style>
    :root {
      --green: #00512F;
      --white: #FFFFFF;
    }

    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      min-height: 100%;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      color: var(--white);
      background: var(--green);
      -webkit-font-smoothing: antialiased;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    .site {
      min-height: 100svh;
      position: relative;
      isolation: isolate;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      background: var(--green);
    }

    /* Full-width architectural background */
    .site::before {
      content: "";
      position: absolute;
      inset: 0;
      z-index: -2;
      background-image: url("sonneh-interior-background-v2.webp");
      background-repeat: no-repeat;
      background-size: cover;
      background-position: center center;
    }

    /* Subtle gradient for text readability */
    .site::after {
      content: "";
      position: absolute;
      inset: 0;
      z-index: -1;
      background: linear-gradient(
        90deg,
        rgba(0,81,47,.60) 0%,
        rgba(0,81,47,.34) 30%,
        rgba(0,81,47,.10) 58%,
        rgba(0,81,47,0) 85%
      );
    }

    .header,
    .hero,
    .footer {
      width: min(94%, 1540px);
      margin-left: auto;
      margin-right: auto;
    }

    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 24px;
      padding: 26px 0 19px;
      border-bottom: 1px solid rgba(255,255,255,.38);
    }

    .logo {
      font-size: clamp(25px, 2.1vw, 34px);
      font-weight: 800;
      letter-spacing: -1.3px;
    }

    .navigation {
      display: flex;
      gap: clamp(22px, 3vw, 46px);
      align-items: center;
    }

    .navigation a {
      font-size: 14px;
      font-weight: 600;
      opacity: .82;
      padding-bottom: 5px;
    }

    .navigation a:hover,
    .navigation a:focus-visible {
      opacity: 1;
    }

    .navigation .active {
      opacity: 1;
      border-bottom: 1px solid var(--white);
    }

    .hero {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      justify-content: center;
      padding: 80px 0 100px;
    }

    .eyebrow {
      margin: 0 0 29px;
      font-size: clamp(11px, .95vw, 14px);
      font-weight: 600;
      letter-spacing: .20em;
    }

    h1 {
      margin: 0;
      font-size: clamp(32px, 3.05vw, 48px);
      font-weight: 700;
      letter-spacing: -.025em;
      line-height: 1.15;
    }

    .description {
      max-width: 520px;
      margin: 26px 0 0;
      font-size: clamp(15px, 1.15vw, 18px);
      line-height: 1.65;
      color: rgba(255,255,255,.95);
    }

    .location {
      margin-top: 42px;
    }

    .location-line {
      width: 52px;
      height: 1px;
      background: var(--white);
      margin-bottom: 20px;
    }

    .location p {
      margin: 0;
      font-size: 11px;
      letter-spacing: .20em;
    }

    .footer {
      display: flex;
      justify-content: flex-end;
      padding: 20px 0 24px;
      font-size: 12px;
      text-shadow: 0 1px 5px rgba(0,0,0,.45);
    }

    @media (max-width: 900px) {
      .site::before {
        background-position: 58% center;
      }

      .site::after {
        background: linear-gradient(
          90deg,
          rgba(0,81,47,.78),
          rgba(0,81,47,.34) 70%,
          rgba(0,81,47,.08)
        );
      }

      h1 {
        max-width: 600px;
      }
    }

    @media (max-width: 600px) {
      .header,
      .hero,
      .footer {
        width: calc(100% - 40px);
      }

      .header {
        padding-top: 24px;
        flex-wrap: wrap;
        gap: 20px;
      }

      .logo {
        font-size: 29px;
      }

      .navigation {
        gap: 24px;
      }

      .navigation a {
        font-size: 13px;
      }

      .site::before {
        background-position: 62% center;
      }

      .site::after {
        background: linear-gradient(
          180deg,
          rgba(0,81,47,.90) 0%,
          rgba(0,81,47,.75) 48%,
          rgba(0,81,47,.30) 100%
        );
      }

      .hero {
        padding: 90px 0 110px;
      }

      .eyebrow {
        font-size: 10px;
        letter-spacing: .13em;
        line-height: 1.8;
      }

      h1 {
        font-size: clamp(34px, 8vw, 46px);
      }

      .description {
        font-size: 16px;
        max-width: 350px;
      }

      .location {
        margin-top: 40px;
      }
    }
  </style>
</head>

<body>
  <div class="site">

    <header class="header">
      <a href="index.html" class="logo" aria-label="SONNEH Home">
        SONNEH
      </a>

      <nav class="navigation" aria-label="Main navigation">
        <a href="index.html" class="active" aria-current="page">Home</a>
        <a href="about.html">About</a>
        <a href="contact.html">Contact</a>
      </nav>
    </header>

    <main class="hero">
      <p class="eyebrow">
        INTERIOR DESIGN &amp; DESIGN STRATEGY
      </p>

      <h1>From Complexity to Clarity.</h1>

      <p class="description">
        Creating considered interiors that connect people,
        place and purpose.
      </p>

      <div class="location">
        <div class="location-line"></div>
        <p>PERTH, WESTERN AUSTRALIA</p>
      </div>
    </main>

    <footer class="footer">
      &copy; SONNEH 2026
    </footer>

  </div>
</body>
</html>
