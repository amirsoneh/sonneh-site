
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#00512F">
<meta name="description" content="SONNEH is an independent concept design, interior design and design strategy studio based in Perth, Western Australia.">
<title>SONNEH | Concept Design & Design Strategy</title>
<style>
:root {
  --green: #00512F;
  --white: #FFFFFF;
  --soft: #E2E9E2;
}
* { box-sizing: border-box; }
html, body { margin: 0; min-height: 100%; }
body {
  font-family: Arial, Helvetica, sans-serif;
  color: var(--white);
  background: var(--green);
  -webkit-font-smoothing: antialiased;
}
a { color: inherit; text-decoration: none; }
.site {
  min-height: 100svh;
  display: flex;
  flex-direction: column;
  position: relative;
  isolation: isolate;
  overflow: hidden;
  background: var(--green);
}
.site::before {
  content: "";
  position: absolute;
  z-index: -2;
  inset: 0 0 0 46%;
  background-image: url("sonneh-interior-background.webp");
  background-size: cover;
  background-position: center;
  background-repeat: no-repeat;
}
.site::after {
  content: "";
  position: absolute;
  z-index: -1;
  inset: 0;
  background: linear-gradient(
    90deg,
    var(--green) 0%,
    var(--green) 30%,
    rgba(0,81,47,.96) 40%,
    rgba(0,81,47,.76) 51%,
    rgba(0,81,47,.12) 78%,
    rgba(0,81,47,0) 100%
  );
}
.header, .hero, .footer {
  width: min(88%, 1480px);
  margin-left: auto;
  margin-right: auto;
}
.header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 24px;
  padding: 42px 0 25px;
  border-bottom: 1px solid rgba(255,255,255,.55);
}
.logo {
  font-size: clamp(28px, 2.7vw, 42px);
  font-weight: 800;
  letter-spacing: -1.6px;
}
.navigation {
  display: flex;
  align-items: center;
  gap: clamp(20px, 3vw, 50px);
}
.navigation a {
  font-size: 17px;
  font-weight: 600;
  opacity: .9;
  padding-bottom: 6px;
}
.navigation a:hover,
.navigation a:focus-visible { opacity: 1; }
.navigation .active {
  border-bottom: 2px solid var(--white);
  opacity: 1;
}
.hero {
  flex: 1;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: flex-start;
  padding: 100px 0;
}
.eyebrow {
  font-size: clamp(12px, 1.15vw, 17px);
  letter-spacing: .2em;
  margin: 0 0 43px;
}
h1 {
  font-size: clamp(35px, 3.25vw, 54px);
  font-weight: 700;
  letter-spacing: -.025em;
  line-height: 1.15;
  white-space: nowrap;
  margin: 0;
}
.description {
  max-width: 620px;
  font-size: clamp(17px, 1.35vw, 21px);
  line-height: 1.65;
  margin: 37px 0 0;
  color: var(--soft);
}
.location {
  margin-top: 48px;
}
.location-line {
  height: 1px;
  width: 68px;
  background: var(--white);
  margin-bottom: 27px;
}
.location p {
  font-size: 13px;
  letter-spacing: .2em;
  margin: 0;
}
.footer {
  padding: 24px 0 28px;
  display: flex;
  justify-content: flex-end;
  font-size: 13px;
  text-shadow: 0 1px 5px rgba(0,0,0,.3);
}
@media (max-width: 1050px) {
  h1 { white-space: normal; max-width: 780px; }
  .site::before { left: 35%; }
  .site::after {
    background: linear-gradient(
      90deg,
      var(--green) 0%,
      rgba(0,81,47,.95) 35%,
      rgba(0,81,47,.48) 75%,
      rgba(0,81,47,.18) 100%
    );
  }
}
@media (max-width: 650px) {
  .header, .hero, .footer {
    width: calc(100% - 40px);
  }
  .header {
    padding-top: 26px;
    flex-wrap: wrap;
    gap: 20px;
  }
  .logo { font-size: 32px; }
  .navigation { gap: 22px; }
  .navigation a { font-size: 14px; }
  .hero { padding: 85px 0; }
  .eyebrow {
    font-size: 11px;
    line-height: 1.8;
    letter-spacing: .13em;
    margin-bottom: 30px;
  }
  h1 {
    font-size: clamp(37px, 8.5vw, 52px);
    max-width: 100%;
  }
  .description {
    font-size: 17px;
    max-width: 370px;
    margin-top: 28px;
  }
  .location { margin-top: 40px; }
  .location p { font-size: 11px; }
  .site::before {
    inset: 34% 0 0 0;
    background-position: 57% center;
  }
  .site::after {
    background: linear-gradient(
      180deg,
      var(--green) 0%,
      rgba(0,81,47,.97) 37%,
      rgba(0,81,47,.85) 60%,
      rgba(0,81,47,.32) 100%
    );
  }
  .footer { font-size: 12px; }
}
</style>
</head>
<body>
<div class="site">
  <header class="header">
    <a class="logo" href="index.html" aria-label="SONNEH Home">SONNEH</a>
    <nav class="navigation" aria-label="Main navigation">
      <a href="index.html" class="active" aria-current="page">Home</a>
      <a href="about.html">About</a>
      <a href="contact.html">Contact</a>
    </nav>
  </header>

  <main class="hero">
    <p class="eyebrow">
      INTERIOR DESIGN &amp; DESIGN STRATEGY
    </p>

    <h1>From Complexity to Clarity.</h1>

    <p class="description">
      Creating considered interiors that connect people,
      place and purpose.
    </p>

    <div class="location">
      <div class="location-line"></div>
      <p>PERTH, WESTERN AUSTRALIA</p>
    </div>
  </main>

  <footer class="footer">
    &copy; SONNEH 2026
  </footer>
</div>
</body>
</html>
